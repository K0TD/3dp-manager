services:
  postgres:
    image: postgres:18-alpine
    container_name: 3dp-postgres-local
    stop_grace_period: 30s
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin
      POSTGRES_DB: 3dp_manager
    ports:
      - "15432:5432"
    volumes:
      - postgres_local_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d 3dp_manager"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - 3dp-local-network

  backend:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: 3dp-backend-local
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USERNAME: admin
      DB_PASSWORD: admin
      DB_NAME: 3dp_manager
      JWT_SECRET: localDevSecretKey12345678901234567890
      ADMIN_LOGIN: admin
      ADMIN_PASSWORD: admin
      PORT: 3100
      LOG_LEVEL: debug
      ALLOWED_ORIGINS: http://localhost:8080,http://localhost
    ports:
      - "3100:3100"
    depends_on:
      postgres:
        condition: service_healthy
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - 3dp-local-network

  frontend:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: 3dp-frontend-local
    ports:
      - "8080:80"
    depends_on:
      - backend
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - 3dp-local-network

networks:
  3dp-local-network:
    driver: bridge

volumes:
  postgres_local_data:
